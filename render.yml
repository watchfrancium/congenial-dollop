name: Render video

on:
  push:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Render
        run: npx remotion render Investigative out/video.mp4

      - uses: actions/upload-artifact@v4
        with:
          name: video
          path: out/video.mp4
